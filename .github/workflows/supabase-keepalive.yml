name: Supabase Keep-Alive (runlog)

# runlog の無料 Supabase プロジェクトが「7日間無活動で自動一時停止」するのを防ぐ。
# 毎日 REST API に1回アクセスして活動とみなさせる。
# あわせて heartbeat ファイルを更新コミットし、GitHub Actions の
# 「60日間リポジトリ無活動でスケジュール停止」も回避する。

on:
  schedule:
    - cron: '17 3 * * *' # 毎日 03:17 UTC（日本時間 12:17頃）
  workflow_dispatch: {}   # 手動実行も可

permissions:
  contents: write

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping Supabase (runlog)
        env:
          # publishable キーはアプリにも埋め込まれている公開キー（RLSで保護）
          SUPABASE_URL: https://xdyoailemhbqmoizbnuw.supabase.co
          SUPABASE_KEY: sb_publishable_rJtSFAYnEpJYV3syX7M2VA_HYJs1Nge
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/runs?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          echo "runlog Supabase REST -> HTTP $code"
          # 200/401/403 いずれもDBに到達＝活動として有効
          case "$code" in
            200|401|403) echo "OK (reached project)";;
            000) echo "::error::could not reach Supabase (DNS/network)"; exit 1;;
            *) echo "::warning::unexpected status $code";;
          esac

      - name: Heartbeat commit
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > keepalive-last-run.txt
          git config user.name "keepalive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add keepalive-last-run.txt
          git commit -m "chore: supabase keepalive $(date -u +%F)" || { echo "no change"; exit 0; }
          git push
